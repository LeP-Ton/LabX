name: 质量检查

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 启用 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装端到端测试浏览器
        run: pnpm exec playwright install --with-deps chromium
      - name: 代码规范
        run: pnpm lint
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元与组件测试
        run: pnpm test
      - name: 生产构建
        run: pnpm build
      - name: 端到端测试
        run: pnpm test:e2e
